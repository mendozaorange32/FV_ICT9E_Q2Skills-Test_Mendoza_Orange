<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 Skills Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --brand-blue: #196672;
    }
s
    .navbar-brand img {
      height: 40px;
    }

    .nav-link {
      color: #333333;
      font-weight: 500;
    }

    .btn-portal {
      background-color: var(--brand-blue);
      color: #ffffff;
      border-radius: 50px;
      padding: 0.5rem 1.25rem;
    }

    .hero-banner-img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      display: block;
    }

    .main-heading {
      color: var(--brand-blue);
      font-weight: 800;
    }
  </style>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-white">


  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/8b5611eb-ff3a-407f-9adc-e116a23373fc/OBMC+LOGO+2024-04.png" alt="OBMC Logo" class="me-2">
        <div class="d-flex flex-column" style="line-height: 1.1;">
          <span class="fw-bold" style="font-size: 0.7rem; color: var(--brand-blue);">OPERATION BROTHERHOOD</span>
          <span class="fw-bold" style="font-size: 0.7rem; color: var(--brand-blue);">MONTESSORI CENTER</span>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mynavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-3">
          <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact Us</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-portal" href="#">My Portal</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="w-100 p-0">
    <img src="https://video.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/ad59fc82-6675-426d-a5bc-631090f2c732/thumbnail" alt="OBMC Banner" class="hero-banner-img">
  </div>

  <main class="container my-5 col-md-8 col-lg-6 mx-auto">
    <div class="text-center mb-4">
      <h2 class="main-heading">OBMC Student Enrollment Inquiry<br></h2>
      <p class="text-muted">Welcome! Fill out this application form for your enrollment.</p>
    </div>

    <form>
      <div class="mb-3">
        <label for="fullname" class="form-label fw-semibold">Full Name (Last, First)</label>
        <input type="text" id="fullname" name="fullname" class="form-control">
      </div>

       <div class="mb-3">
        <label for="birthdate" class="form-label fw-semibold">Birth Date (mm/dd/yyyy)</label>
        <input type="birthdate" id="birthdate" name="birthdate" class="form-control">
      </div>

       <div class="mb-3">
        <label for="gender" class="form-label fw-semibold">Gender</label>
        <select id="gender" name="gender" class="form-select">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <input type="email" id="email" name="email" class="form-control">
      </div>

      <div class="mb-3">
        <label for="grade" class="form-label fw-semibold">Grade Level</label>
        <select id="grade" name="grade" class="form-select">
          <option value="Free Trial">Free Trial</option>
          <option value="Casa">Casa Program: Pre-Kindergarten to Kindergarten (Ages 3 to 5)</option>
          <option value="Primary">Primary Level: Grades 1 to 3 (Ages 6 to 8)</option>
          <option value="Intermediate">Intermediate Level: Grades 4 to 6 (Ages 9 to 12)</option>
          <option value="Junior High School">Junior High School (JHS): Grades 7 to 10 (Ages 13 to 16)</option>
          <option value="Senior High School">Senior High School (SHS): Grades 11 and 12 (Ages 17 to 18)</option>
        </select>
      </div>

        <div class="mb-3">
        <label for="contact number" class="form-label fw-semibold">Contact Number</label>
        <input type="contact number" id="contact number" name="contact number" class="form-control">
      </div>

      <div class="mb-4">
        <label for="reason" class="form-label fw-semibold">Message</label>
        <textarea id="message" name="message" rows="3" class="form-control"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-portal px-4">Submit Application</button>
      </div>
    </form>
  </main>

  <footer class="bg-light text-center py-4 border-top mt-auto">
    <div class="container">
      <p class="mb-0 text-muted small">2026 O.B. Montessori Center. All rights reserved. // Made by Orange F. Mendoza</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
